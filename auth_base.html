<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · InsightIQ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="blob b1"></div><div class="blob b2"></div>
  <svg class="net" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g stroke="#93b4e6" stroke-width="1" opacity=".6">
      <line x1="80" y1="120" x2="240" y2="220"/><line x1="240" y1="220" x2="420" y2="140"/><line x1="420" y1="140" x2="600" y2="240"/>
      <line x1="600" y1="240" x2="720" y2="120"/><line x1="240" y1="220" x2="300" y2="400"/><line x1="300" y1="400" x2="520" y2="460"/>
      <line x1="520" y1="460" x2="600" y2="240"/><line x1="120" y1="480" x2="300" y2="400"/><line x1="520" y1="460" x2="700" y2="520"/>
    </g>
    <g fill="#2563eb"><circle cx="80" cy="120" r="5"/><circle cx="240" cy="220" r="6"/><circle cx="420" cy="140" r="5"/><circle cx="600" cy="240" r="6"/>
      <circle cx="720" cy="120" r="4"/><circle cx="300" cy="400" r="6"/><circle cx="520" cy="460" r="5"/><circle cx="120" cy="480" r="4"/><circle cx="700" cy="520" r="5"/></g>
  </svg>
  <div class="auth-card fade-in">
    <div class="text-center mb-3">
      <span class="brand justify-content-center" style="color:var(--navy)"><span class="logo text-white"><i class="bi bi-graph-up-arrow"></i></span>InsightIQ</span>
      <div class="text-muted small fw-semibold">AI-Powered Business Intelligence &amp; Decision Intelligence Platform</div>
    </div>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="alert alert-{{ cat }} py-2 small">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
