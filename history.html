{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block content %}
<div class="page-head d-flex justify-content-between align-items-start flex-wrap gap-2"><div><h2>Analysis history</h2><p>Everything you've uploaded and analysed, newest first.</p></div>
  {% if rows %}<form method="post" action="{{ url_for('main.history_clear') }}" onsubmit="return confirm('Clear all history?')"><button class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Clear history</button></form>{% endif %}</div>
<div class="card-x">{% include "_timeline.html" %}</div>
{% endblock %}
