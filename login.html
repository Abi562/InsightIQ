{% extends "auth_base.html" %}
{% block content %}
<h4 class="mb-3">Sign in to your workspace</h4>
<form method="post">
  <div class="mb-3"><label class="form-label fw-semibold">Email</label>
    <input type="email" name="email" class="form-control" required autofocus value="{{ request.form.get('email','') }}"></div>
  <div class="mb-3"><label class="form-label fw-semibold">Password</label>
    <input type="password" name="password" class="form-control" required></div>
  <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
</form>
<div class="text-center mt-3 small">New here? <a href="{{ url_for('main.register') }}" class="fw-bold">Create an account</a></div>
<div class="mt-3 p-2 rounded-3 small" style="background:#eff6ff;border:1px solid #bfdbfe">
  <i class="bi bi-info-circle text-primary"></i> <b>Demo account</b> with sample data ready:<br>
  <code>{{ demo_email }}</code> / <code>{{ demo_pass }}</code>
</div>
{% endblock %}
