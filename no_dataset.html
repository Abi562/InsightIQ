{% extends "base.html" %}
{% block title %}No dataset{% endblock %}
{% block content %}
<div class="card-x text-center py-5" style="max-width:640px;margin:2rem auto">
  <i class="bi bi-cloud-arrow-up text-primary" style="font-size:3rem"></i>
  <h4 class="mt-2">Start by adding a dataset</h4>
  <p class="text-muted">This page analyses your active dataset. Upload a CSV or Excel file, or try the built-in retail sales demo.</p>
  <div class="d-flex gap-2 justify-content-center flex-wrap">
    <a href="{{ url_for('main.upload') }}" class="btn btn-primary"><i class="bi bi-upload me-1"></i>Upload dataset</a>
    <form method="post" action="{{ url_for('main.load_demo') }}"><button class="btn btn-outline-primary"><i class="bi bi-magic me-1"></i>Load demo data</button></form>
  </div>
</div>
{% endblock %}
